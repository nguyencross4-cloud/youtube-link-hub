<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d1c">
<title>Video Hub | Watch & Enjoy</title>
<style>
:root{--ink:#f7f8ff;--muted:#a9b2ca;--cyan:#69e6ff;--violet:#9d83ff;--pink:#ff78c8}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:#090d1c;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px 18px}
body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;width:56vmax;height:56vmax;border-radius:50%;filter:blur(90px);opacity:.22;animation:drift 15s ease-in-out infinite alternate}
body:before{background:#4e43d8;top:-28vmax;left:-18vmax}
body:after{background:#087e9c;right:-25vmax;bottom:-30vmax;animation-delay:-7s}
@keyframes drift{to{transform:translate(9vw,8vh) scale(1.18)}}
main{position:relative;z-index:1;width:min(100%,680px)}
.topline{display:flex;align-items:center;justify-content:space-between;margin:0 4px 18px;color:#c8d0e6;font-size:11px;letter-spacing:2.2px;font-weight:800}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;display:grid;place-items:center;border:1px solid #ffffff2a;border-radius:11px;background:#ffffff12;color:var(--cyan);box-shadow:0 0 24px #69e6ff25;font-size:16px}
.status{display:flex;align-items:center;gap:7px;color:#9ca9c7;font-size:10px;letter-spacing:1.2px}
.dot{width:7px;height:7px;border-radius:50%;background:#65f0b0;box-shadow:0 0 12px #65f0b0}
.panel{position:relative;overflow:hidden;border:1px solid #ffffff24;border-radius:28px;padding:clamp(25px,6vw,48px);background:linear-gradient(145deg,#ffffff16,#ffffff08);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 100px #0008,inset 0 1px #ffffff24}
.panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#ffffff12,transparent 35%,transparent 70%,#8d7cff0c)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #ffffff24;border-radius:99px;background:#ffffff0c;color:#cbd5f2;font-size:10px;font-weight:800;letter-spacing:1.8px}
h1{position:relative;margin:22px 0 10px;font-size:clamp(36px,8vw,58px);line-height:1;letter-spacing:-2.8px;font-weight:850}
h1 span{background:linear-gradient(95deg,#fff 8%,#9ceeff 48%,#c1a8ff 92%);background-clip:text;-webkit-background-clip:text;color:transparent}
.lead{margin:0 0 30px;color:var(--muted);font-size:14px;line-height:1.7}
.links{display:grid;gap:13px}
.video-link{position:relative;isolation:isolate;display:flex;align-items:center;gap:15px;min-height:88px;padding:16px 18px;overflow:hidden;border:1px solid #ffffff22;border-radius:19px;background:linear-gradient(110deg,#ffffff12,#ffffff08);color:var(--ink);text-decoration:none;transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease;outline:none}
.video-link:before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(100deg,#69e6ff1c,#9d83ff18,#ff78c815);opacity:0;transition:opacity .25s ease}
.video-link:hover,.video-link:focus-visible{transform:translateY(-3px);border-color:#8beaff88;box-shadow:0 12px 34px #0005,0 0 25px #69e6ff16}
.video-link:hover:before,.video-link:focus-visible:before{opacity:1}
.video-link:active{transform:scale(.975)}
.play{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#ff6d9d,#ed3d68);box-shadow:0 7px 22px #f33d7045;color:white;font-size:19px;transition:transform .22s ease,box-shadow .22s ease}
.video-link:hover .play{transform:rotate(-7deg) scale(1.08);box-shadow:0 0 28px #ff5c91a0}
.meta{min-width:0;flex:1}
.meta small{display:block;margin-bottom:5px;color:#9ca9c7;font-size:9px;font-weight:800;letter-spacing:1.7px}
.meta strong{display:block;font-size:15px;letter-spacing:.1px}
.meta em{display:block;margin-top:4px;color:#aab5d0;font-size:11px;font-style:normal}
.arrow{color:#a9b8d7;font-size:22px;transition:transform .2s ease,color .2s ease}
.video-link:hover .arrow{transform:translate(3px,-3px);color:var(--cyan)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:2;background:#a9f1ff66;transform:scale(0);animation:ripple .65s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
footer{display:flex;justify-content:space-between;gap:10px;margin:20px 5px 0;color:#7f8aa8;font-size:10px;letter-spacing:1.2px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="topline"><div class="brand"><div class="logo">▶</div><span>PERSONAL VIDEO HUB</span></div><div class="status"><i class="dot"></i> READY TO PLAY</div></div>
  <section class="panel">
    <div class="eyebrow">✦ &nbsp; YOUR WATCHLIST</div>
    <h1><span>Pick your<br>next video.</span></h1>
    <p class="lead">Chọn một video bên dưới để mở và thưởng thức trên YouTube.</p>
    <nav class="links" aria-label="Video links">
      <a class="video-link" href="https://youtu.be/dQw4w9WgXcQ?si=G2PqK4BSYSZj9d0x" target="_blank" rel="noopener noreferrer">
        <span class="play" aria-hidden="true">▶</span>
        <span class="meta"><small>VIDEO 01 · YOUTUBE</small><strong>Open video one</strong><em>Nhấn để xem video</em></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="video-link" href="https://youtu.be/QDia3e12czc?si=StxIHhQxJZddoZQR" target="_blank" rel="noopener noreferrer">
        <span class="play" aria-hidden="true">▶</span>
        <span class="meta"><small>VIDEO 02 · YOUTUBE</small><strong>Open video two</strong><em>Nhấn để xem video</em></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </section>
  <footer><span>TWO LINKS · ONE PLACE</span><span>MADE TO WATCH ✦</span></footer>
</main>
<script>
document.querySelectorAll('.video-link').forEach(link=>{
  link.addEventListener('click',event=>{
    const rect=link.getBoundingClientRect();
    const size=Math.max(rect.width,rect.height)*1.5;
    const ripple=document.createElement('span');
    ripple.className='ripple';
    ripple.style.width=ripple.style.height=size+'px';
    ripple.style.left=(event.clientX-rect.left-size/2)+'px';
    ripple.style.top=(event.clientY-rect.top-size/2)+'px';
    link.appendChild(ripple);
    setTimeout(()=>ripple.remove(),700);
  });
});
</script>
</body>
</html>
