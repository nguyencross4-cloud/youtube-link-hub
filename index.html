<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b46">
<title>YouTube Link Hub</title>
<style>
:root{color-scheme:light;--navy:#102b46;--blue:#176b9b;--muted:#647789;--line:#dce6ed}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b3a;background:radial-gradient(circle at 15% 10%,#dff2f5 0,transparent 34%),linear-gradient(145deg,#f4f8fb,#eaf1f6)}
main{width:min(100%,620px)}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 18px 4px;color:var(--navy)}
.mark{width:44px;height:44px;border-radius:14px;background:var(--navy);color:white;display:grid;place-items:center;font-size:21px}
.brand small{display:block;font-size:10px;letter-spacing:2px;font-weight:800;color:var(--muted)}
.brand strong{font-size:16px;letter-spacing:.4px}
.panel{background:#fff;border:1px solid #e0e9ef;border-radius:24px;padding:clamp(24px,6vw,42px);box-shadow:0 24px 70px #17334a14}
.tag{display:inline-block;padding:7px 11px;border:1px solid #d6e8ef;border-radius:99px;background:#f1f8fa;color:#176b83;font-size:10px;font-weight:800;letter-spacing:1px}
h1{margin:18px 0 9px;color:var(--navy);font-size:clamp(30px,7vw,42px);line-height:1.12;letter-spacing:-1px}
p{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.7}
.links{display:grid;gap:12px}
a{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;transition:.18s}
a:hover{transform:translateY(-2px);border-color:#9bcbd5;box-shadow:0 9px 24px #17334a10}
.play{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:#fff0f0;color:#d8232a;font-size:20px}
.info{min-width:0;flex:1}.info small{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px}
.info strong{display:block;color:var(--navy);font-size:15px}.info span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.arrow{color:#78909f;font-size:20px}
footer{text-align:center;margin-top:18px;color:#80909b;font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="mark">▶</div><div><small>QUICK ACCESS</small><strong>YOUTUBE LINK HUB</strong></div></div>
  <section class="panel">
    <span class="tag">VIDEO COLLECTION</span>
    <h1>Choose a video</h1>
    <p>Chọn một trong hai liên kết bên dưới để mở video trên YouTube.</p>
    <div class="links">
      <a href="https://youtu.be/dQw4w9WgXcQ?si=G2PqK4BSYSZj9d0x" target="_blank" rel="noopener noreferrer">
        <div class="play">▶</div><div class="info"><small>VIDEO 01</small><strong>Open YouTube video 1</strong><span>Watch on YouTube</span></div><div class="arrow">↗</div>
      </a>
      <a href="https://youtu.be/QDia3e12czc?si=StxIHhQxJZddoZQR" target="_blank" rel="noopener noreferrer">
        <div class="play">▶</div><div class="info"><small>VIDEO 02</small><strong>Open YouTube video 2</strong><span>Watch on YouTube</span></div><div class="arrow">↗</div>
      </a>
    </div>
  </section>
  <footer>ONE PAGE · TWO YOUTUBE LINKS</footer>
</main>
</body>
</html>
